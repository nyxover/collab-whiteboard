[package]
name = "collab-whiteboard-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.21"
yrs = "0.21"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
